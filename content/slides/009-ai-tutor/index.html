<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>009 AIを先生にして資格勉強（リール背景用 1080x820 の2枚）</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* リール専用の横長スライド（1080x820）。書き出し: node scripts/render-slides.js 009-ai-tutor --height 820
     リールでは左右 65px が UI に隠れるため、左右は 96px 内側（端から 35px 以上）に置く */
  .slide.reel { height: 820px; padding: 104px 96px 52px; }
  .reel .top { top: 36px; }
  .reel .top b { font-size: 26px; color: var(--ink); font-weight: 700; }
  .reel .top .right { display: flex; gap: 24px; align-items: center; }
  .reel .kicker { font-size: 46px; font-weight: 900; color: var(--accent); letter-spacing: .04em; line-height: 1.3; margin-bottom: 6px; }
  .reel h2 { font-size: 80px; line-height: 1.25; margin-bottom: 24px; }
  .reel .fill { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .reel .fill > .card, .reel .fill > .step { flex: 1; }
  .reel .list { gap: 24px; }
  .reel .list .card { font-size: 54px; line-height: 1.3; font-weight: 900; padding: 0 52px; align-items: center; gap: 36px; }
  .reel .list .card small { font-size: 40px; margin-top: 6px; font-weight: 900; color: var(--sub); }
  .reel .list .card.hot small { color: var(--accent); }
  .reel .list .card.hot { border-color: var(--accent); border-width: 4px; }
  .reel .ico { width: 88px; height: 88px; border-radius: 24px; font-size: 50px; }
  .reel .flow { gap: 0; }
  .reel .step { font-size: 46px; line-height: 1.3; padding: 0 48px; gap: 36px; }
  .reel .step .n { width: 80px; height: 80px; font-size: 44px; }
  .reel .down { font-size: 36px; line-height: 1; padding: 2px 0; }
  .reel .stat { display: flex; align-items: baseline; justify-content: space-between; }
  .reel .stat b { font-size: 84px; line-height: 1; color: var(--accent); font-weight: 900; }
  .reel .privacy { margin-top: 18px; font-size: 28px; font-weight: 700; color: var(--sub); line-height: 1.4; }
  .reel .note { margin-top: 14px; font-size: 28px; font-weight: 700; color: var(--sub); line-height: 1.4; }
  .reel .list .card .stat2 { display:block; }
  .reel .laps { gap: 14px; }
  .reel .laps .card { font-size: 40px; line-height: 1.25; font-weight: 900; padding: 0 36px; align-items: center; gap: 28px; }
  .reel .laps .card small { font-size: 30px; margin-top: 2px; font-weight: 900; color: var(--sub); }
  .reel .laps .ico { width: 80px; height: 80px; border-radius: 22px; font-size: 30px; }
  .reel .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .reel .cats div { border: 3px solid var(--line, #ccc); border-radius: 20px; padding: 18px 0; text-align: center; font-size: 36px; font-weight: 900; line-height: 1.2; }
  .reel .cats div.hot { border-color: var(--accent); color: var(--accent); border-width: 4px; }
  .reel .list .card.ex { font-size: 40px; line-height: 1.35; font-weight: 900; padding: 0 40px; }
  .reel .list .card.ex small { display:block; font-size: 30px; color: var(--sub); margin-top: 4px; font-weight: 900; }
</style>
</head>
<body>

<!-- 1. 20周勉強法 -->
<section class="slide reel">
  <div class="top"><span class="tag">自宅AI開発ログ #09</span><span class="right"><b>@takato.engineer</b><span class="page"></span></span></div>
  <div class="kicker">資格の参考書1冊を20周する</div>
  <h2 style="font-size:54px"><span class="mark">周ごとに役割が変わる</span></h2>
  <div class="fill list laps">
    <div class="card"><span class="ico">1周</span><div>通読<small>まず最後まで読む</small></div></div>
    <div class="card hot"><span class="ico">4周</span><div>一問一答<small>AIが問題を出す</small></div></div>
    <div class="card"><span class="ico">10周</span><div>間違いの原因分析<small>なぜ間違えたかを調べる</small></div></div>
    <div class="card"><span class="ico">20周</span><div>白紙から書き出す<small>何も見ずに再現する</small></div></div>
  </div>
</section>

<!-- 2. 原因4分類 -->
<section class="slide reel">
  <div class="top"><span class="tag">自宅AI開発ログ #09</span><span class="right"><b>@takato.engineer</b><span class="page"></span></span></div>
  <div class="kicker">間違いの原因を4つに分ける</div>
  <h2 style="font-size:54px"><span class="mark">ただの○×で終わらない</span></h2>
  <div class="cats"><div>知識不足</div><div>誤読</div><div class="hot">混同</div><div>単純ミス</div></div>
  <div class="fill list">
    <div class="card hot ex"><div>実例：CPU情報を出すファイルを<br>似た名前と取り違えた<small>答え /dev/cpuinfo ／ 正解 /proc/cpuinfo<br>原因は<span style="color:var(--accent)">「混同」</span></small></div></div>
  </div>
  <div class="note">※進みはまだ1〜2章です。試験日も未定</div>
</section>

<script>
  const slides = document.querySelectorAll('.slide');
  slides.forEach((el, i) => { const pg = el.querySelector('.page'); if (pg) pg.textContent = `${i + 1}/${slides.length}`; });
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) document.body.dataset.theme = q.get('theme');
  const n = Number(q.get('n'));
  if (n) {
    document.body.classList.add('single');
    slides[n - 1]?.classList.add('on');
  }
</script>
</body>
</html>

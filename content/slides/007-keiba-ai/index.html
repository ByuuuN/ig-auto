<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>007 AIはオッズに負けた（リール背景用 1080x820 の2枚）</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* リール専用の横長スライド（1080x820）。書き出し: node scripts/render-slides.js 007-keiba-ai --height 820
     リールでは左右 65px が UI に隠れるため、左右は 96px 内側（端から 35px 以上）に置く */
  .slide.reel { height: 820px; padding: 104px 96px 52px; }
  .reel .top { top: 36px; }
  .reel .top b { font-size: 26px; color: var(--ink); font-weight: 700; }
  .reel .top .right { display: flex; gap: 24px; align-items: center; }
  .reel .kicker { font-size: 46px; font-weight: 900; color: var(--accent); letter-spacing: .04em; line-height: 1.3; margin-bottom: 6px; }
  .reel h2 { font-size: 80px; line-height: 1.25; margin-bottom: 24px; }
  .reel .fill { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .reel .fill > .card, .reel .fill > .step { flex: 1; }
  .reel .list { gap: 24px; }
  .reel .list .card { font-size: 54px; line-height: 1.3; font-weight: 900; padding: 0 52px; align-items: center; gap: 36px; }
  .reel .list .card small { font-size: 40px; margin-top: 6px; font-weight: 900; color: var(--sub); }
  .reel .list .card.hot small { color: var(--accent); }
  .reel .list .card.hot { border-color: var(--accent); border-width: 4px; }
  .reel .ico { width: 88px; height: 88px; border-radius: 24px; font-size: 50px; }
  .reel .flow { gap: 0; }
  .reel .step { font-size: 46px; line-height: 1.3; padding: 0 48px; gap: 36px; }
  .reel .step .n { width: 80px; height: 80px; font-size: 44px; }
  .reel .down { font-size: 36px; line-height: 1; padding: 2px 0; }
  .reel .stat { display: flex; align-items: baseline; justify-content: space-between; }
  .reel .stat b { font-size: 84px; line-height: 1; color: var(--accent); font-weight: 900; }
  .reel .privacy { margin-top: 18px; font-size: 28px; font-weight: 700; color: var(--sub); line-height: 1.4; }
</style>
</head>
<body>

<!-- 1. 回収率の比較 -->
<section class="slide reel">
  <div class="top"><span class="tag">自宅AI開発ログ #07</span><span class="right"><b>@takato.engineer</b><span class="page"></span></span></div>
  <div class="kicker">1万円分買ったときの戻り</div>
  <h2 style="font-size:60px"><span class="mark">AIの選択は全部買うより損</span></h2>
  <div class="fill list">
    <div class="card hot"><span class="ico">AI</span><div>AIが「買い」と判断した<br>馬だけ<small>→ 1万円が 6500円に</small></div></div>
    <div class="card"><span class="ico">全</span><div>全部の馬を買った場合<small>→ 1万円が 7100円に</small></div></div>
  </div>
</section>

<!-- 2. 原因 -->
<section class="slide reel">
  <div class="top"><span class="tag">自宅AI開発ログ #07</span><span class="right"><b>@takato.engineer</b><span class="page"></span></span></div>
  <div class="kicker">原因</div>
  <h2 style="font-size:60px"><span class="mark">人気薄を買いすぎた</span></h2>
  <div class="fill flow">
    <div class="step"><span class="n">1</span><div>AIが「お得」と判断するのは<br>人気のない馬</div></div>
    <div class="down">↓</div>
    <div class="step"><span class="n">2</span><div>買った馬の半分以上が<br>50倍超の人気薄</div></div>
  </div>
</section>

<script>
  const slides = document.querySelectorAll('.slide');
  slides.forEach((el, i) => { const pg = el.querySelector('.page'); if (pg) pg.textContent = `${i + 1}/${slides.length}`; });
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) document.body.dataset.theme = q.get('theme');
  const n = Number(q.get('n'));
  if (n) {
    document.body.classList.add('single');
    slides[n - 1]?.classList.add('on');
  }
</script>
</body>
</html>

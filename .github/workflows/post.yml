# 予約投稿用のワークフロー。
#
# - 手動実行（Actions タブの Run workflow）は既定で DRY_RUN。投稿はしない
# - 予約実行（schedule）は実際に投稿する。キューの status が ready で、
#   scheduled_for を過ぎたものが 1 件だけ対象になる
# - 止めたいとき: Actions タブ → post → 右上の「…」→ Disable workflow
name: post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true なら投稿せずにチェックだけ行う'
        type: choice
        options: ['true', 'false']
        default: 'true'
  schedule:
    # Actions の予約は混雑で遅れたり飛ばされたりする（9/15 は 2 回とも開始されなかった）。
    # そのため 15 分おきに何度も仕込む。投稿済みなら後続の実行は何もしない
    # （キューから外れる＋同じ本文の投稿を API で確認する）。
    # 時刻は UTC。混雑しやすい 0 分ちょうどを避けている。
    - cron: '7 23 15 9 *'                # 9/16 08:07 JST — 予約実行が動くかの確認（予定時刻前なので投稿しない）
    - cron: '7 3 16 9 *'                 # 9/16 12:07 JST — 同上
    - cron: '52 11 16 9 *'               # 9/16 20:52 JST — 001-autoscribe
    - cron: '7,22,37,52 12-14 16 9 *'    # 9/16 21:07〜23:52 JST — 予備（15 分おき）

permissions:
  contents: write   # 投稿済みのキューを commit するため

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish next item in queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: v23.0
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/assets
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
        # 対話できないので --yes が必要。内容は push 前に人が確認済みであること
        run: npm run post -- --yes ${{ github.event_name == 'workflow_dispatch' && '--ignore-schedule' || '' }}

      - name: Commit queue state
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/
          git diff --staged --quiet || git commit -m 'chore: update queue state'
          git pull --rebase
          git push

# 予約投稿用のワークフロー。
#
# 起動のされ方は 3 通り:
# - 時計役（Google Apps Script, tools/gas-scheduler）: 5 分おきにキューを確認し、
#   予定時刻を過ぎた投稿があれば dry_run=false で起動する。これがメイン
# - 予約実行（schedule）: 時計役が止まっていたときの予備。数時間遅れることがある
# - 手動実行（Actions タブの Run workflow）: 既定で DRY_RUN。投稿はしない
#
# どの起動でも、投稿されるのは status が ready で scheduled_for を過ぎたものだけ。
# 1 回の実行で最大 1 件。同じ本文が投稿済みなら投稿しない。
# 止めたいとき: Actions タブ → post → 右上の「…」→ Disable workflow
name: post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true なら投稿せずにチェックだけ行う'
        type: choice
        options: ['true', 'false']
        default: 'true'
  schedule:
    # 予備。Actions の予約は 2〜5 時間遅れることがある（2026-09 の実測）。時刻は UTC
    - cron: '37 */2 * * *'

permissions:
  contents: write   # 投稿済みのキューを commit するため

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish next item in queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: v23.0
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/assets
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
        # 対話できないので --yes が必要。内容は push 前に人が確認済みであること
        run: npm run post -- --yes ${{ github.event_name == 'workflow_dispatch' && '--ignore-schedule' || '' }}

      - name: Commit queue state
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/
          git diff --staged --quiet || git commit -m 'chore: update queue state'
          git pull --rebase
          git push
